학생들은 일본의 켄다마를, 일본 학생들은 한국의 제기를 살펴보며 장난감의 생김새와 놀이 방법을 알아봅 니다. 평소 접하기 어려웠던 상대 국가의 전통 놀이에 관심을 가지고 새로운 문화를 탐색합니다. (2) 전통 장난감 직접 만들기 한국 학생들은 켄다마를, 일본 학생들은 제기를 직접 만들어 봅니다. 장난감의 구조와 특징을 살펴보고, 놀이에 필요한 도구를 스스로 완성하며 전통 놀이를 체험할 준비를 합니다. (3) 만든 장난감으로 놀이하기 직접 만든 켄다마와 제기를 활용하여 놀이를 즐깁니다. 놀이 방법을 익히고 반복해서 도전하며 각 장난감의 재미 와 특징을 경험합니다. 놀이를 통해 상대 국가의 전통문화를 더욱 친근하게 받아들이고, 서로의 경험과 느낌을 나눕니다. 공도초등학교 국제교류 수업 자료집 37 PART 2 · 주제 7", "PART 2 · 문화 교류 수업 | 7차시 · 이어서 ▲ 켄다마를 만든 한국 학생들 ▲ 직접 만든 제기로 제기차기 놀이를 하는 일본 학생들 3) 활동의 교육적 의미 전통문화는 책 속의 지식으로만 이해하는 것이 아니라 직접 경험하고 즐기는 과정에서 더욱 생생하게 다가옵니다. 학생들은 상대 국가의 전통 장난감을 만들고 놀이하면서 우리에게 익숙한 놀이와 다른 나라의 놀이를 비교해 보는 기회를 가졌습니다. 또한 서로 다른 문화를 낯설게 여기기보다 직접 체험하고 즐기며 이해하는 태도를 기를 수 있었습니다. 무엇보다 이번 활동은 한국 학생이 일본의 문화를, 일본 학생이 한국의 문화를 경험하는 상호 문화 체험이라는 점에서 의미가 있습니다. 놀이에는 국경이 없다는 것을 경험하며, 전통문화가 과거의 유산에 머무르지 않고 오늘날에도 함께 즐기고 이어 갈 수 있는 소중한 문화임을 발견하는 시간이었습니다. 공도초등학교 국제교류 수업 자료집  PART 2 · 주제 7", "2025–2026 Gongdo Global Classroom P A R T 03 03", "PART 3 지속가능발전(SDGs) 수업 | 함께 문제를 해결하는 수업 1. SDGs와 목표 2: Zero Hunger 1) Zero Hunger란 무엇인가요? 지속가능발전목표(SDGs)는 더 나은 삶과 지구의 미래를 위해 유엔 회원국이 함께 정한 17가지 목표입니다. 그중 목표 2 ‘Zero Hunger(기아 종식)’는 굶주림을 없애고 누구나 언제든 안전하고 영양가 있는 음식을 충분히 먹을 수 있도록 하자는 약속입니다. 가뭄으로 수확이 줄거나 음식값이 오르면 필요한 음식을 구하기 어려워집니다. 앞으로도 먹거리를 안정적으로 기를 수 있도록 지속가능한 농업을 돕는 일도 이 목표에 포함됩니다. ▲ 유엔 지속가능발전목표 17개 (첨부 이미지). 노란색 2번이 Zero Hunger입니다. 2) 왜 Zero Hunger를 선택했나요? 교사들은 한일 국제교류에서 서로의 문화를 알아가는 경험을 공동의 문제 해결로 이어 가고 싶었습니다. 그래서 학 생들이 실제 문제를 조사하고 해결 방법을 함께 찾아보는 프로젝트 기반 학습(PBL)을 하기로 했습니다. 두 학교가 함께 살펴볼 주제를 논의하며 17개 지속가능발전목표를 검토했고, 목표 2가 학생들의 일상과 연결하기에 적합하 다고 판단했습니다. 급식은 메뉴와 배식 방식에서 서로의 문화를 살필 수 있는 소재입니다. 급식 문화가 달라도 식사 뒤 음식이 남는 일 은 두 학교에서 함께 살펴볼 수 있습니다. 학생은 자기 학교에서 직접 관찰하고, 일본 친구의 경험을 들으며, 학교에 서 시도할 방법까지 의논할 수 있어 급식을 프로젝트의 출발점으로 삼았습니다. 공도초등학교 국제교류 수업 자료집 39 PART 3 · 주제 1", "PART 3 · 지속가능발전(SDGs) 수업 | 1차시 · 이어서 3) 사전 학습: 다큐멘터리 영상 시청하기 학생들은 Zero Hunger 수업을 준비하며 KBS 다큐멘터리 〈먹다 버릴 지구는 없다〉를 보았습니다. 이 영상은 달걀 한 개가 깨져 한 판이 통째로 버려지는 사례를 통해, 아직 먹을 수 있는 식품도 유통 과정에서 버려질 수 있 음을 보여 줍니다. 학교 급식과의 연결 학교 급식에서도 배식하고 남은 음식이나 식 mn.addEventListener('wheel',e=>{e.preventDefault();const[a,b]=rel(e);setZ(z*(e.deltaY<0?1.15:1/1.15),a,b)},{passive:false});
const pts=new Map();let pd=0;
const dist=()=>{const a=[...pts.values()];return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])};
mn.addEventListener('pointerdown',e=>{pts.set(e.pointerId,[e.clientX,e.clientY]);try{mn.setPointerCapture(e.pointerId)}catch(_){}pd=pts.size===2?dist():0});
mn.addEventListener('pointermove',e=>{const o=pts.get(e.pointerId);if(!o)return;const n=[e.clientX,e.clientY];pts.set(e.pointerId,n);if(pts.size===2){const d=dist();if(pd)setZ(z*d/pd);pd=d}else if(z>1){px+=n[0]-o[0];py+=n[1]-o[1];applyZ()}});
['pointerup','pointercancel'].forEach(t=>mn.addEventListener(t,e=>{pts.delete(e.pointerId);pd=0}));
addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key==='+'||e.key==='=')setZ(z+.25);if(e.key==='-')setZ(z-.25);if(e.key==='0')setZ(1)});
addEventListener('resize',applyZ);
spread=isSpread();const m0=/^#p(\d+)$/.exec(location.hash);show(m0?+m0[1]:0,1);
</script></body></html>
